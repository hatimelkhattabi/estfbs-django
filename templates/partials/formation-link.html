{% set brochure=formation.brochure %}
<a href="{{ asset(brochure) if brochure else '#' }}" class="{{ 'mobile-nav-link flex items-center justify-between gap-2 py-1 hover:text-orange-600 font-medium text-slate-700' if contexte=='mobile' else ('text-blue-800 hover:text-orange-600 font-medium transition' if contexte=='footer' else 'flex items-center justify-between gap-3 px-4 py-2 text-xs text-blue-900 hover:bg-blue-50 hover:text-orange-600 transition') }}" data-formation-context="{{ contexte }}" data-formation-cycle="{{ cycle }}" data-formation-name="{{ formation.nom }}" {% if brochure %}target="_blank" rel="noopener noreferrer"{% endif %}>
{% if contexte=='footer' %}{{ formation.nom }}{% else %}<span class="flex items-center gap-3"><i class="fas {{ formation.icon }} text-orange-500 w-4" aria-hidden="true"></i><span class="font-bold block text-blue-900">{{ formation.nom }}</span></span>{% if brochure %}<i class="fas fa-file-pdf text-red-600 text-[11px]" aria-hidden="true"></i>{% endif %}{% endif %}</a>
