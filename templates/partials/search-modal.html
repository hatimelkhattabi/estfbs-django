
<div id="search-modal" role="dialog" aria-modal="true" aria-label="Rechercher dans les actualités et événements" class="fixed inset-0 z-[120] bg-slate-950/80 backdrop-blur-sm hidden items-start justify-center p-4 pt-20">
    <div class="bg-white dark:bg-slate-900 rounded-3xl max-w-xl w-full shadow-2xl border border-slate-200 dark:border-slate-800 overflow-hidden">
      
      <div class="p-4 border-b border-slate-100 dark:border-slate-800 flex items-center gap-3">
        <i class="fas fa-search text-accent-500 text-base ml-2"></i>
        <input 
          id="search-input" 
          type="text" 
          placeholder="Rechercher une actualité ou un événement…" aria-label="Votre recherche"
          class="w-full bg-transparent border-none text-sm text-slate-800 dark:text-white focus:outline-none placeholder-slate-400" 
        />
        <button id="search-close" aria-label="Fermer la recherche" class="p-1.5 text-slate-400 hover:text-slate-700 dark:hover:text-white">
          <i class="fas fa-times text-sm"></i>
        </button>
      </div>

      <div id="search-results" aria-live="polite" class="p-4 max-h-80 overflow-y-auto space-y-1"></div>

      <div class="p-3 bg-white/80 dark:bg-slate-800/50 border-t border-slate-100 dark:border-slate-800 flex justify-between items-center text-[10px] text-slate-400">
        <span>Naviguez avec <kbd class="px-1 border rounded bg-white dark:bg-slate-700">↑</kbd> <kbd class="px-1 border rounded bg-white dark:bg-slate-700">↓</kbd></span>
        <span>Appuyez sur <kbd class="px-1 border rounded bg-white dark:bg-slate-700">Échap</kbd> pour fermer</span>
      </div>

    </div>
  </div>
