<article class="dm-tile {{ 'dm-tile-video' if media.type=='video' else '' }}" data-gallery-entry data-kind="{{ media.type }}">
{% if media.type=='video' %}<video class="dm-video" controls playsinline preload="metadata" {% if media.vignette_url %}poster="{{ media.vignette_url }}"{% endif %} aria-label="{{ media.titre }}"><source src="{{ media.fichier_url }}" type="{{ 'video/webm' if media.fichier.lower().endswith('.webm') else 'video/mp4' }}">Votre navigateur ne peut pas lire cette vidéo.</video>
{% else %}<button type="button" class="dm-image-button" data-gallery-image="{{ media.fichier_url }}" data-caption="{{ media.legende or media.titre }}" aria-label="Agrandir : {{ media.titre }}"><img src="{{ media.fichier_url }}" alt="{{ media.titre }}" loading="lazy"><span class="dm-enlarge">Agrandir ↗</span></button>{% endif %}
{% if not previewGallery %}<div class="dm-caption"><span class="pub-eyebrow">{{ 'Vidéo' if media.type=='video' else 'Photo' }}{% if media.categorie %} · {{ media.categorie }}{% endif %}</span><h3>{{ media.titre }}</h3>{% if media.legende %}<p>{{ media.legende }}</p>{% endif %}</div>{% endif %}</article>
