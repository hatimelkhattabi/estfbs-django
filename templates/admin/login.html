<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion Administration - EST Fquih Ben Salah</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="bg-transparent text-blue-950 min-h-screen flex items-center justify-center p-4 relative font-sans">
  <!-- Canvas Global Réseau de Nœuds Pointés Interconnectés sur Fond Blanc -->
  <canvas id="nodes-canvas" class="fixed inset-0 w-full h-full pointer-events-none z-[-1] block"></canvas>


    <div class="max-w-md w-full bg-white/95 backdrop-blur-md rounded-3xl p-8 shadow-2xl border-2 border-blue-100">
        
        <div class="text-center mb-8">
            <div class="flex items-center justify-center gap-4 mb-4">
                <div class="bg-white p-1 rounded-xl border border-blue-200 shadow-sm">
                    <img src="{{ asset('assets/img/logo-est.jpg') }}" alt="Logo EST" class="h-12 w-auto object-contain rounded">
                </div>
                <a href="https://usms.ac.ma" target="_blank" rel="noopener noreferrer" class="bg-white p-1 rounded-xl border border-blue-200 shadow-sm hover:scale-105 transition-transform" title="Université Sultan Moulay Slimane">
                    <img src="{{ asset('assets/img/logo-usms.png') }}" alt="Logo Université Sultan Moulay Slimane" class="h-12 w-auto object-contain rounded">
                </a>
            </div>
            <h1 class="text-2xl font-black tracking-tight text-blue-900">Espace Scolarité & Administration</h1>
            <p class="text-xs text-blue-950/70 mt-1">EST Fquih Ben Salah - Université Sultan Moulay Slimane</p>
        </div>

        {% if not not (error) %}
            <div class="mb-6 p-4 rounded-xl bg-red-50 border border-red-200 text-red-700 text-xs flex items-center gap-3">
                <i class="fas fa-exclamation-circle text-base shrink-0"></i>
                <span>{{ error }}</span>
            </div>
        {% endif %}

        {% if form_errors %}<p role="alert">{{ form_errors[0] }}</p>{% endif %}
<form method="POST" action="{{ route('login.store') }}" class="space-y-4">
{{ csrf_input }}<input type="hidden" name="next" value="{{ next }}">
            <div>
                <label class="block text-xs font-semibold text-blue-900 mb-1">Nom d'utilisateur</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-blue-400">
                        <i class="fas fa-user text-xs"></i>
                    </span>
                    <input type="text" name="username" required autocomplete="username" value="{{ form.username.value() or '' }}" placeholder="Ex: admin" 
                           class="w-full pl-9 pr-4 py-2.5 bg-white border border-blue-200 rounded-xl text-sm text-blue-950 focus:ring-2 focus:ring-orange-500 focus:outline-none">
                </div>
            </div>

            <div>
                <label class="block text-xs font-semibold text-blue-900 mb-1">Mot de passe</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-blue-400">
                        <i class="fas fa-lock text-xs"></i>
                    </span>
                    <input type="password" name="password" required autocomplete="current-password" placeholder="••••••••" 
                           class="w-full pl-9 pr-4 py-2.5 bg-white border border-blue-200 rounded-xl text-sm text-blue-950 focus:ring-2 focus:ring-orange-500 focus:outline-none">
                </div>
            </div>

            <div class="pt-2">
                <button type="submit" 
                        class="w-full py-3 bg-orange-500 hover:bg-orange-600 text-white font-bold rounded-xl shadow-lg hover:shadow-orange-500/25 transition transform hover:-translate-y-0.5 text-xs uppercase tracking-wider">
                    <i class="fas fa-sign-in-alt mr-2"></i> Se Connecter
                </button>
            </div>
        </form>

        

        <div class="mt-6 text-center">
            <a href="{{ url('index.html') }}" class="text-xs text-blue-800 hover:text-orange-600 font-bold transition flex items-center justify-center gap-2">
                <i class="fas fa-arrow-left"></i>
                <span>Retour au portail du site</span>
            </a>
        </div>

    </div>

  <script src="{{ asset('js/nodes-canvas.js') }}"></script>
</body>
</html>
