{% if pager.has_other_pages() %}<nav class="est-pagination" aria-label="Pagination">{% if pager.has_previous() %}<a class="pub-btn secondary" href="?page={{ pager.previous_page_number() }}{% if query.get('q') %}&q={{ query.get('q')|urlencode }}{% endif %}{% if query.get('type') %}&type={{ query.get('type')|urlencode }}{% endif %}">← Précédent</a>{% endif %}<span>Page {{ pager.number }} / {{ pager.paginator.num_pages }}</span>{% if pager.has_next() %}<a class="pub-btn secondary" href="?page={{ pager.next_page_number() }}{% if query.get('q') %}&q={{ query.get('q')|urlencode }}{% endif %}{% if query.get('type') %}&type={{ query.get('type')|urlencode }}{% endif %}">Suivant →</a>{% endif %}</nav>{% endif %}
